[auth]
redirect_uri = ""
token_file = "secrets/token.json"

[sync]
local_folder = "/mnt/nas/photos"
interval_seconds = 60
concurrency = 5

# Какие папки Яндекс Диска в какие подпапки local_folder копировать.
# remote = "/" означает весь диск, local = "" означает сам local_folder.
[[sync.mappings]]
remote = "/Фотокамера"
local = "Фотокамера"

[logging]
dir = "logs"
level_stdout = "INFO"
level_file = "INFO"
level_error = "WARNING"
