[tool.poetry]
name = "synchronization-app"
version = "0.1.0"
description = "Синхронизация папок Яндекс Диска с локальным и сетевым диском"
authors = ["Boris"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.34.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.0"
mypy = "^2.4.0"
pre-commit = "^4.6.2"
types-requests = "^2.33.0.20261006"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "D"]
ignore = ["D100", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"{config,folder_script,logger_config,main,yandex_api}.py" = ["D", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["config", "folder_script", "logger_config", "main", "yandex_api"]
ignore_errors = true
